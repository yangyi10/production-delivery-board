<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>生产交付计划看板</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <main class="page">
      <nav class="topbar">
        <div>
          <span class="eyebrow">PRODUCTION DELIVERY BOARD</span>
          <strong>生产交付计划看板</strong>
        </div>
        <div class="workflow-actions" id="workflowActions"></div>
      </nav>

      <section class="project-header card">
        <div class="project-main">
          <div class="state-line">
            <span class="state-badge" id="projectStatus"></span>
            <span id="versionText"></span>
            <span id="editHint"></span>
          </div>
          <div class="project-fields" id="projectFields"></div>
          <div class="project-note">
            <div class="project-note-heading">
              <span>项目备注</span>
              <small>内容变更后自动保存</small>
            </div>
            <textarea id="projectNote" maxlength="1000" placeholder="可填写项目背景、特殊交付要求、需关注事项等"></textarea>
          </div>
        </div>
        <div class="progress-ring" id="progressRing">
          <div><strong id="overallProgress"></strong><span>整体进度</span></div>
        </div>
      </section>

      <section class="card">
        <div class="section-heading">
          <div>
            <span class="eyebrow">PROJECT MILESTONES</span>
            <h2>项目任务总览</h2>
            <p>聚焦项目关键里程碑；点击一级任务可展开具体任务及执行信息。</p>
          </div>
          <div class="overview-actions"><button class="primary" id="addMacroTaskButton" onclick="addMacroTask(data.tasks.length)">＋ 新增一级任务</button></div>
        </div>
        <div class="task-overview" id="taskOverview"></div>
      </section>

      <section class="card change-card" id="changeCard">
        <div class="section-heading">
          <div><span class="eyebrow">PLAN HISTORY</span><h2>计划调整记录</h2></div>
        </div>
        <div id="changeLogs"></div>
      </section>
    </main>

    <dialog id="taskDialog">
      <form id="taskForm">
        <div class="dialog-title">
          <div><span class="eyebrow">ADD TASK</span><h2 id="taskDialogTitle">新增任务</h2></div>
          <button type="button" class="icon-btn" onclick="taskDialog.close()">×</button>
        </div>
        <input type="hidden" id="newTaskType" />
        <input type="hidden" id="newTaskParent" />
        <label>任务名<input id="newTaskName" required /></label>
        <label id="newTaskDescriptionLabel">任务描述<textarea id="newTaskDescription" rows="3" maxlength="500"></textarea></label>
        <label>计划开始日期<input id="newTaskStart" type="date" required /></label>
        <label>计划完成日期<input id="newTaskEnd" type="date" required /></label>
        <label>负责人<input id="newTaskOwner" required /></label>
        <div class="dialog-actions"><button type="button" class="secondary" onclick="taskDialog.close()">取消</button><button class="primary">确认新建</button></div>
      </form>
    </dialog>

    <dialog id="adjustDialog">
      <form id="adjustForm">
        <div class="dialog-title">
          <div><span class="eyebrow">ADJUST PLAN</span><h2>调整计划</h2></div>
          <button type="button" class="icon-btn" id="closeAdjustDialog">×</button>
        </div>
        <p class="dialog-description">填写调整原因后，项目资料、负责人及计划日期将解锁。</p>
        <label>调整原因<textarea id="adjustReason" rows="4" maxlength="500" required placeholder="例如：客户要求将第二批交付日期延后至 11 月 30 日"></textarea></label>
        <div class="dialog-actions">
          <button type="button" class="secondary" id="cancelAdjustDialog">取消</button>
          <button class="primary" id="submitAdjustButton">确认并解锁计划</button>
        </div>
      </form>
    </dialog>

    <div id="toast"></div>

    <script>
      let data = {{ project | tojson }};
      const statuses = ["未开始", "进行中", "已完成"];
      const statusClass = { 未开始: "pending", 进行中: "working", 已完成: "done" };
      const $ = (selector) => document.querySelector(selector);
      const escapeHtml = (value = "") => String(value).replace(/[&<>'"]/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[char]);
      const shortDate = (value) => value ? value.slice(5).replace("-", ".") : "—";

      function fieldInput(label, field, value, type = "text") {
        return `<label class="project-field"><span>${label}</span><input type="${type}" value="${escapeHtml(value)}" ${data.can_edit_plan ? "" : "disabled"} onchange="updateProject('${field}', this.value)" /></label>`;
      }

      function fieldReadonly(label, value) {
        return `<div class="project-field readonly"><span>${label}</span><strong>${escapeHtml(value || "—")}</strong></div>`;
      }

      function statusOptions(current) {
        return statuses.map((item) => `<option ${item === current ? "selected" : ""}>${item}</option>`).join("");
      }

      function render() {
        renderActions();
        renderProject();
        renderTasks();
        renderLogs();
      }

      function renderActions() {
        let buttons = "";
        if (data.status === "草稿") buttons = `<button class="primary" onclick="confirmPlan()">确认计划并开始执行</button>`;
        if (data.status === "执行中" && !data.editing_plan) buttons = `<button class="secondary" onclick="adjustPlan()">调整计划</button><button class="primary" onclick="closeProject()">项目结项</button>`;
        if (data.editing_plan) buttons = `<button class="primary" onclick="confirmPlan()">确认调整并锁定</button>`;
        workflowActions.innerHTML = buttons;
      }

      function renderProject() {
        projectStatus.textContent = data.editing_plan ? "计划调整中" : data.status;
        projectStatus.className = `state-badge state-${data.editing_plan ? "adjust" : data.status}`;
        versionText.textContent = `计划版本 V${data.plan_version}`;
        editHint.textContent = data.can_edit_plan ? "蓝框内容可编辑" : (data.can_update_progress ? "计划已锁定，可更新实际进度" : "全部内容只读");
        projectFields.innerHTML = [
          fieldInput("项目名称", "name", data.name), fieldReadonly("制定人", data.creator),
          fieldInput("项目编号", "code", data.code), fieldReadonly("制定日期", data.created_date),
          fieldInput("客户", "customer", data.customer), fieldInput("启动日期", "launch_date", data.launch_date, "date"),
          fieldInput("产品型号", "product", data.product), fieldInput("承诺交付日期", "promised_delivery_date", data.promised_delivery_date, "date"),
          fieldInput("生产供应商", "supplier", data.supplier),
        ].join("");
        overallProgress.textContent = `${data.progress}%`;
        progressRing.style.setProperty("--progress", data.progress);
        projectNote.value = data.note || "";
        projectNote.disabled = !data.can_edit_plan;
      }

      function taskField(taskIndex, childIndex, field, value, type = "text", extraClass = "", minValue = "", forceDisabled = false) {
        const change = field === "actual"
          ? `updateActualDate(${taskIndex}, ${childIndex === null ? "null" : childIndex}, this)`
          : childIndex === null
            ? `updateMacroTask(${taskIndex}, '${field}', this.value)`
            : `updateChildTask(${taskIndex}, ${childIndex}, '${field}', this.value)`;
        const progressField = field === "actual" || field === "status";
        const enabled = !forceDisabled && (progressField ? data.can_update_progress : data.can_edit_plan);
        const dateRules = field === "actual" ? `min="${escapeHtml(minValue || "")}" onfocus="prepareActualDate(this)"` : "";
        const changeEvent = field === "actual" ? "oninput" : "onchange";
        return `<input class="cell-input ${extraClass}" type="${type}" value="${escapeHtml(value || "")}" ${dateRules} ${enabled ? "" : "disabled"} ${changeEvent}="${change}" />`;
      }

      function prepareActualDate(input) {
        if (!input.value) {
          const today = new Date().toLocaleDateString("en-CA");
          input.value = input.min && today < input.min ? input.min : today;
        }
        if (typeof input.showPicker === "function") {
          try { input.showPicker(); } catch (error) { /* 浏览器会使用原生日历 */ }
        }
      }

      function changeTaskStatus(select, taskIndex, childIndex, previousStatus) {
        if (select.value === "已完成") {
          const row = select.closest(childIndex === null ? ".macro-row" : ".child-row");
          const actualInput = row && row.querySelector(".actual-input");
          if (actualInput && !actualInput.value) {
            select.value = previousStatus;
            actualInput.dataset.pendingComplete = "true";
            notice("请先选择该任务的实际完成日期");
            setTimeout(() => actualInput.focus(), 0);
            return;
          }
        }
        return childIndex === null
          ? updateMacroTask(taskIndex, "status", select.value)
          : updateChildTask(taskIndex, childIndex, "status", select.value);
      }

      function renderTasks() {
        addMacroTaskButton.hidden = !data.can_edit_plan;
        const head = `<div class="macro-row macro-head"><span>任务名</span><span>计划开始</span><span>计划完成</span><span>实际完成</span><span>负责人</span><span>计划时间进度</span><span>状态 / 操作</span></div>`;
        taskOverview.innerHTML = head + data.tasks.map((task, taskIndex) => {
          const children = task.children || [];
          const rows = children.length ? children.map((child, childIndex) => `
            <div class="child-row">
              ${taskField(taskIndex, childIndex, "name", child.name)}
              ${taskField(taskIndex, childIndex, "description", child.description, "text", "description-input")}
              ${taskField(taskIndex, childIndex, "start", child.start, "date")}
              ${taskField(taskIndex, childIndex, "end", child.end, "date")}
              ${taskField(taskIndex, childIndex, "actual", child.actual, "date", "actual-input", child.start)}
              ${taskField(taskIndex, childIndex, "owner", child.owner)}
              <div class="child-status"><select class="status-select ${statusClass[child.status]}" ${data.can_update_progress ? "" : "disabled"} onchange="changeTaskStatus(this, ${taskIndex}, ${childIndex}, '${child.status}')">${statusOptions(child.status)}</select><div class="child-actions">${task.name === "大货制造" && data.can_edit_plan ? `<button class="copy-child" onclick="event.preventDefault();copyChild(${taskIndex}, ${childIndex})">复制</button>` : ""}${data.can_edit_plan ? `<button class="delete-child" onclick="event.preventDefault();deleteChild(${taskIndex}, ${childIndex}, '${escapeHtml(child.name)}')">删除</button>` : ""}</div></div>
            </div>`).join("") : `<div class="empty-children">暂无具体任务，可按项目实际需要添加。</div>`;
          return `<details class="macro-task" ${taskIndex === 0 ? "open" : ""}>
            <summary class="macro-row">
              <div class="macro-name"><div class="order-control"><button title="上移" ${!data.can_edit_plan || taskIndex === 0 ? "disabled" : ""} onclick="event.preventDefault();event.stopPropagation();changeOrder(${taskIndex}, ${taskIndex})">▲</button><input class="order-input" inputmode="numeric" value="${taskIndex + 1}" title="输入目标序号" ${data.can_edit_plan ? "" : "disabled"} onclick="event.stopPropagation()" onchange="changeOrder(${taskIndex}, this.value)" /><button title="下移" ${!data.can_edit_plan || taskIndex === data.tasks.length - 1 ? "disabled" : ""} onclick="event.preventDefault();event.stopPropagation();changeOrder(${taskIndex}, ${taskIndex + 2})">▼</button></div>${taskField(taskIndex, null, "name", task.name)}</div>
              ${taskField(taskIndex, null, "start", task.start, "date", "", "", children.length > 0)}
              ${taskField(taskIndex, null, "end", task.end, "date", "", "", children.length > 0)}
              ${taskField(taskIndex, null, "actual", task.actual, "date", "actual-input", task.start, children.length > 0)}
              ${taskField(taskIndex, null, "owner", task.owner)}
              <div class="task-progress"><div class="task-progress-track"><i style="width:${task.progress}%"></i></div><strong>${task.progress}%</strong></div>
              <div class="macro-status"><select class="status-select ${statusClass[task.status]}" ${data.can_update_progress && children.length === 0 ? "" : "disabled"} title="${children.length ? "状态由具体任务自动汇总" : ""}" onclick="event.stopPropagation()" onchange="changeTaskStatus(this, ${taskIndex}, null, '${task.status}')">${statusOptions(task.status)}</select>${data.can_edit_plan ? `<button class="delete-macro" onclick="event.preventDefault();event.stopPropagation();deleteMacroTask(${taskIndex}, '${escapeHtml(task.name)}')">删除</button>` : ""}</div>
            </summary>
            <div class="children-panel"><div class="children-title"><strong>具体任务</strong>${data.can_edit_plan ? `<button class="secondary" onclick="addChild(${taskIndex})">＋ 新增具体任务</button>` : ""}</div><div class="child-head"><span>任务名</span><span>任务描述</span><span>计划开始</span><span>计划完成</span><span>实际完成</span><span>负责人</span><span>状态 / 操作</span></div>${rows}</div>
          </details>`;
        }).join("");
      }

      function renderLogs() {
        changeCard.hidden = data.change_logs.length === 0;
        const sessions = [];
        data.change_logs.forEach((log) => {
          if (log.type === "adjustment" || !log.type) {
            sessions.push({ header: log, changes: [] });
          } else {
            if (!sessions.length) sessions.push({ header: { version: log.version, reason: log.reason, time: log.time }, changes: [] });
            sessions[sessions.length - 1].changes.push(log);
          }
        });
        changeLogs.innerHTML = sessions.reverse().map((session) => `
          <article class="change-session">
            <header><div><strong>V${session.header.version} 计划调整</strong><span>${escapeHtml(session.header.reason)}</span></div><time>${session.header.time}</time></header>
            ${session.changes.length ? `<ul>${session.changes.map((log) => `<li><div><b>${escapeHtml(log.scope)}</b><span>${escapeHtml(log.field)}：${escapeHtml(log.old)} → ${escapeHtml(log.new)}</span></div><time>${log.time}</time></li>`).join("")}</ul>` : `<p class="empty-change">本次调整尚未修改具体内容</p>`}
          </article>`).join("");
      }

      async function api(url, options = {}) {
        try {
          const response = await fetch(url, { headers: { "Content-Type": "application/json" }, ...options });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) { notice(result.error || `操作失败（${response.status}）`); return null; }
          await reload();
          notice(result.message || "已保存");
          return result;
        } catch (error) {
          notice("无法连接服务器，请确认 Flask 服务正在运行");
          return null;
        }
      }

      async function reload() { data = await fetch("/api/project").then((response) => response.json()); render(); }
      function updateProject(field, value) { return api("/api/project", { method: "PATCH", body: JSON.stringify({ [field]: value }) }); }
      function updateMacroTask(index, field, value) { return api(`/api/tasks/${index}`, { method: "PATCH", body: JSON.stringify({ [field]: value }) }); }
      function addMacroTask(position) { openTaskDialog("macro", position); }
      function changeOrder(index, position) { return api(`/api/tasks/${index}/move`, { method: "POST", body: JSON.stringify({ position }) }); }
      function deleteMacroTask(index, name) {
        if (confirm(`确认删除一级任务“${name}”及其全部具体任务？`)) return api(`/api/tasks/${index}`, { method: "DELETE" });
      }
      function updateChildTask(index, childIndex, field, value) { return api(`/api/tasks/${index}/children/${childIndex}`, { method: "PATCH", body: JSON.stringify({ [field]: value }) }); }
      async function updateActualDate(index, childIndex, input) {
        const value = input.value;
        if (childIndex === null) {
          await updateMacroTask(index, "actual", value);
        } else {
          await updateChildTask(index, childIndex, "actual", value);
        }
      }
      function addChild(index) { openTaskDialog("child", index); }
      function copyChild(index, childIndex) { return api(`/api/tasks/${index}/children/${childIndex}/copy`, { method: "POST", body: "{}" }); }
      function deleteChild(index, childIndex, name) {
        if (confirm(`确认删除具体任务“${name}”？`)) return api(`/api/tasks/${index}/children/${childIndex}`, { method: "DELETE" });
      }

      function openTaskDialog(type, parentOrPosition) {
        taskForm.reset();
        newTaskType.value = type;
        newTaskParent.value = parentOrPosition;
        taskDialogTitle.textContent = type === "macro" ? "新增一级任务" : "新增具体任务";
        newTaskDescriptionLabel.hidden = type === "macro";
        newTaskDescription.required = type === "child";
        taskDialog.showModal();
        setTimeout(() => newTaskName.focus(), 0);
      }

      taskForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (newTaskEnd.value < newTaskStart.value) {
          notice("计划完成日期不能早于计划开始日期");
          return;
        }
        const payload = { name: newTaskName.value.trim(), description: newTaskDescription.value.trim(), start: newTaskStart.value, end: newTaskEnd.value, owner: newTaskOwner.value.trim() };
        const result = newTaskType.value === "macro"
          ? await api("/api/tasks", { method: "POST", body: JSON.stringify({ ...payload, position: Number(newTaskParent.value) }) })
          : await api(`/api/tasks/${newTaskParent.value}/children`, { method: "POST", body: JSON.stringify(payload) });
        if (result) taskDialog.close();
      });
      projectNote.addEventListener("change", () => updateProject("note", projectNote.value));

      async function confirmPlan() {
        if (!confirm(data.editing_plan ? "确认本次调整并重新锁定计划？" : "确认项目信息和全部计划？确认后将进入执行阶段。")) return;
        await api("/api/project/confirm", { method: "POST", body: "{}" });
      }
      function adjustPlan() {
        adjustReason.value = "";
        adjustDialog.showModal();
        setTimeout(() => adjustReason.focus(), 0);
      }
      async function closeProject() {
        if (!confirm("确认项目已完成并结项？结项后全部内容不可编辑。")) return;
        await api("/api/project/close", { method: "POST", body: "{}" });
      }

      closeAdjustDialog.addEventListener("click", () => adjustDialog.close());
      cancelAdjustDialog.addEventListener("click", () => adjustDialog.close());
      adjustForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const reason = adjustReason.value.trim();
        if (!reason) {
          notice("请填写调整原因");
          adjustReason.focus();
          return;
        }
        submitAdjustButton.disabled = true;
        const result = await api("/api/project/adjust", { method: "POST", body: JSON.stringify({ reason }) });
        submitAdjustButton.disabled = false;
        if (result) adjustDialog.close();
      });
      function notice(message) {
        toast.textContent = message; toast.classList.add("show"); clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => toast.classList.remove("show"), 2400);
      }

      render();
    </script>
  </body>
</html>
